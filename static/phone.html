<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk Buddy</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-header: #1c2128;
    --card: #21262d;
    --line: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2ea043;
    --accent-hover: #3fb950;
    --danger: #da3633;
    --danger-hover: #f85149;
    --caller: #58a6ff;
    --lcd-bg: #9ea792;
    --lcd-txt: #151a12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  /* Header */
  header.app-header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status-dot.active {
    background: var(--accent);
  }

  /* Layout */
  .wrap {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 16px;
    max-width: 1500px;
    margin: 0 auto;
    padding: 16px;
  }
  @media(max-width: 960px) { .wrap { grid-template-columns: 1fr; } }

  /* Phone Interface */
  .phone-sec { display: flex; flex-direction: column; gap: 10px; }
  .phone {
    background: #161b22;
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 16px 14px 20px;
    box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
  }
  .speaker-slit {
    width: 48px;
    height: 4px;
    border-radius: 2px;
    background: #0d1117;
    margin: 0 auto 12px;
  }
  
  /* Monospace LCD */
  .lcd {
    background: var(--lcd-bg);
    color: var(--lcd-txt);
    border-radius: 6px;
    height: 220px;
    padding: 8px 10px;
    font-family: "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lcd .top {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    border-bottom: 1px solid rgba(21, 26, 18, 0.2);
    padding-bottom: 3px;
  }
  .lcd .title {
    font-weight: 700;
    font-size: 13px;
    margin: 6px 0 2px;
  }
  .lcd .speech-box {
    flex: 1;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    margin-top: 4px;
    word-break: break-word;
  }
  .lcd .digits {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    min-height: 16px;
    margin-top: 2px;
  }
  .lcd .sms {
    background: #151a12;
    color: #9ea792;
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 11px;
    margin-top: 6px;
    display: none;
  }

  /* Sound Level Meter */
  .meter-box { margin-top: 8px; }
  .meter {
    height: 4px;
    background: #0d1117;
    border-radius: 2px;
    overflow: hidden;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.08s;
  }

  /* Call Actions */
  .callrow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .callrow button {
    border: 0;
    border-radius: 6px;
    height: 38px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: background 0.12s;
  }
  #dial { background: var(--accent); }
  #dial:hover:not(:disabled) { background: var(--accent-hover); }
  #end { background: var(--danger); }
  #end:hover:not(:disabled) { background: var(--danger-hover); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Keypad */
  .keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 12px;
  }
  .keys button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    height: 34px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .keys button:hover { background: #30363d; }
  .keys button:active { background: #388bfd; color: #fff; }

  /* Sub-Actions */
  .quick-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .quick-bar button {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .quick-bar button:hover { border-color: var(--muted); }

  /* Consent Alert Box */
  .consent-card {
    background: var(--card);
    border: 1px solid #388bfd;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    display: none;
  }
  .consent-title {
    font-weight: 600;
    font-size: 12px;
    color: #58a6ff;
    margin-bottom: 4px;
  }
  .consent-desc {
    font-size: 11.5px;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .consent-btns { display: flex; gap: 6px; }
  .consent-btns button {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-allow { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-deny { background: var(--panel); color: var(--text); }

  /* Side Options */
  .side-opts {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .side-opts label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .side-opts input[type=text] {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 12px;
    outline: none;
  }
  .side-opts input[type=text]:focus { border-color: #58a6ff; }

  /* Browser Viewport Stage */
  .stage {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 14px;
    min-width: 0;
  }
  .browser-screen {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Browser Bar */
  .browser-bar {
    background: var(--panel-header);
    border-bottom: 1px solid var(--line);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .nav-group { display: flex; gap: 4px; }
  .nav-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 4px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: border-color 0.12s;
  }
  .nav-btn:hover { border-color: var(--muted); }
  .url-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: #0d1117;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 8px;
    gap: 6px;
    min-width: 0;
  }
  #urlInput {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--text);
    font: 12px/1.3 "SF Mono", Consolas, monospace;
    outline: none;
    min-width: 0;
  }
  .url-go-btn {
    background: transparent;
    border: 0;
    color: var(--accent-hover);
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    padding: 0 4px;
  }
  .bar-tools { display: flex; align-items: center; gap: 6px; }
  .tool-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.12s;
  }
  .tool-btn.active { border-color: var(--accent); color: var(--accent-hover); }
  .tool-btn.muted { opacity: 0.55; color: var(--muted); }
  .live-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    background: #1c261e;
    color: var(--accent-hover);
    border: 1px solid rgba(46,160,67,0.4);
  }

  /* Viewport Media Container */
  .viewport-wrap {
    position: relative;
    background: #05070a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 420px;
    overflow: hidden;
  }
  #shot {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: contain;
    background: #05070a;
    color: transparent;
    cursor: crosshair;
  }
  #shot:not([src]) { visibility: hidden; }

  /* Visual Click Ripple */
  .click-ripple {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.5);
    animation: ripple 0.35s ease-out forwards;
    z-index: 10;
  }
  @keyframes ripple {
    to { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }

  /* Fullscreen Mode */
  .stage.fullscreen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999;
    background: #000;
    padding: 0;
  }
  .stage.fullscreen .browser-screen { height: 100%; border-radius: 0; border: 0; }
  .stage.fullscreen .viewport-wrap { flex: 1; min-height: 0; }
  .stage.fullscreen #shot { aspect-ratio: auto; height: 100%; }

  /* Columns */
  .cols {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 14px;
    min-height: 0;
  }
  @media(max-width: 1050px) { .cols { grid-template-columns: 1fr; } }
  .box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    overflow-y: auto;
    max-height: 380px;
    display: flex;
    flex-direction: column;
  }
  .box-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Messages */
  .msg {
    margin: 0 0 8px;
    padding: 8px 10px;
    border-radius: 6px;
    border-left: 3px solid;
    background: #1c2128;
    font-size: 12.5px;
  }
  .msg-head {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    margin-bottom: 2px;
  }
  .msg.guide { border-color: var(--accent); }
  .msg.guide .msg-author { color: var(--accent-hover); font-weight: 600; }
  .msg.caller { border-color: var(--caller); }
  .msg.caller .msg-author { color: var(--caller); font-weight: 600; }
  .msg.cut { opacity: 0.5; text-decoration: line-through; }
  .msg.ignored { opacity: 0.45; font-style: italic; border-left-style: dashed; }

  /* Activity Log */
  .log-entry {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11.5px;
    padding: 3px 0;
    border-bottom: 1px solid #21262d;
    color: var(--muted);
    word-break: break-word;
  }
  .log-entry b { color: var(--text); }
  .action-tag {
    background: #21262d;
    color: #e6edf3;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10.5px;
    margin-right: 4px;
    border: 1px solid var(--line);
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">Talk Buddy</div>
  <div class="header-meta">
    <span id="rateLabel">48 kHz / 16 kHz</span>
    <span class="status-tag">
      <span class="status-dot" id="headerDot"></span>
      <span id="statusTxt">Ready</span>
    </span>
  </div>
</header>

<div class="wrap">
  <!-- Left Column: The Phone -->
  <section class="phone-sec">
    <div class="phone">
      <div class="speaker-slit"></div>
      <div class="lcd">
        <div class="top">
          <span>5G</span>
          <span>HD</span>
          <span id="timer">00:00</span>
        </div>
        <div class="title" id="who">Dial-a-Browser</div>
        <div class="digits" id="digits"></div>
        <div class="speech-box" id="last">Ready. Press Call to start.</div>
        <div class="sms" id="sms"></div>
      </div>

      <div class="meter-box">
        <div class="meter"><i id="lvl"></i></div>
      </div>

      <div class="callrow">
        <button id="dial">Call</button>
        <button id="end" disabled>End</button>
      </div>

      <div class="keys">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="*">*</button><button data-key="0">0</button><button data-key="#">#</button>
      </div>

      <div class="quick-bar">
        <button id="quickLoginBtn" title="Request login handling on current page">Sign In</button>
        <button id="quickSkipAdBtn" title="Skip video advertisement">Skip Ad</button>
      </div>
    </div>

    <!-- Autonomous Consent Card -->
    <div class="consent-card" id="consentCard">
      <div class="consent-title" id="consentTitle">Authentication Required</div>
      <div class="consent-desc" id="consentDesc">Website requires sign-in. Proceed with login?</div>
      <div class="consent-btns">
        <button class="btn-allow" id="consentAllowBtn">Log In</button>
        <button class="btn-deny" id="consentDenyBtn">Cancel</button>
      </div>
    </div>

    <div class="side-opts">
      <label>
        <input type="checkbox" id="barge" checked> Duplex voice (barge-in enabled)
      </label>
      <input type="text" id="typed" placeholder="Type message and press Enter">
    </div>
  </section>

  <!-- Right Column: Live Browser Viewport & Activity -->
  <section class="stage" id="stage">
    <div class="browser-screen">
      <div class="browser-bar">
        <div class="nav-group">
          <button class="nav-btn" id="navBack" title="Back">&larr;</button>
          <button class="nav-btn" id="navFwd" title="Forward">&rarr;</button>
          <button class="nav-btn" id="navReload" title="Reload">&#8635;</button>
        </div>
        <div class="url-wrap">
          <input type="text" id="urlInput" value="Ready" placeholder="Enter URL...">
          <button class="url-go-btn" id="urlGo">Go</button>
        </div>
        <div class="bar-tools">
          <button class="tool-btn active" id="pageAudioBtn">Audio</button>
          <button class="tool-btn" id="fullscreenBtn">Fullscreen</button>
          <span class="live-badge">LIVE</span>
        </div>
      </div>
      <div class="viewport-wrap" id="viewportWrap">
        <img id="shot" alt="Live Browser Viewport">
      </div>
    </div>

    <div class="cols">
      <!-- Conversation Column -->
      <div class="box" id="convo">
        <div class="box-title">
          <span>Conversation</span>
          <span style="font-size:10px; text-transform:none;">Caller / Assistant</span>
        </div>
        <div id="convoList"></div>
      </div>

      <!-- Agent Activity Log -->
      <div class="box" id="logBox">
        <div class="box-title">
          <span>Activity Log</span>
          <button id="clearLogBtn" style="background:transparent; border:0; color:var(--muted); cursor:pointer; font-size:10.5px;">Clear</button>
        </div>
        <div id="logList"></div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
let ws = null, ctx = null, micCtx = null, micStream = null, worklet = null;
let outGain = null, mediaGain = null;
let sttRate = 16000, ttsRate = 48000;
let playHead = 0, mediaHead = 0;
let sources = [], timerId = null, lastSay = null;
let pageAudioOn = true, currentMediaTarget = 0.95;
let pendingScreen = null, rafScreen = 0;
let dialedNumbers = "";

// ---- UI Helpers ----
function addMsg(kind, author, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  d.innerHTML = `<div class="msg-head"><span class="msg-author">${author}</span><span>${timeStr}</span></div>`;
  d.appendChild(document.createTextNode(text));
  $('convoList').appendChild(d);
  $('convo').scrollTop = $('convo').scrollHeight;
  return d;
}

function log(html) {
  const d = document.createElement('div');
  d.className = 'log-entry';
  d.innerHTML = html;
  $('logList').appendChild(d);
  $('logBox').scrollTop = $('logBox').scrollHeight;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- DTMF Tone Synthesis ----
function playDtmfTone(char) {
  if (!ctx) return;
  const dtmfFrequencies = {
    '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
    '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
    '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
    '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
  };
  const freqs = dtmfFrequencies[char];
  if (!freqs) return;
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const toneGain = ctx.createGain();
  osc1.frequency.value = freqs[0];
  osc2.frequency.value = freqs[1];
  toneGain.gain.setValueAtTime(0.06, ctx.currentTime);
  toneGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
  osc1.connect(toneGain);
  osc2.connect(toneGain);
  toneGain.connect(ctx.destination);
  osc1.start();
  osc2.start();
  osc1.stop(ctx.currentTime + 0.11);
  osc2.stop(ctx.currentTime + 0.11);
}

// ---- Audio Jitter Buffer & Playback ----

// Assistant Speech: gapless scheduling with micro-fades
function playPcm(buf) {
  if (!ctx || !outGain) return;
  const samples = Math.floor(buf.byteLength / 2);
  if (!samples) return;
  const i16 = new Int16Array(buf, 0, samples);
  const ab = ctx.createBuffer(1, samples, ttsRate || 48000);
  const ch = ab.getChannelData(0);
  for (let i = 0; i < samples; i++) ch[i] = i16[i] / 32768;

  // Boundary micro-ramp: prevents DC pop at chunk edges
  const fade = Math.min(16, Math.floor(samples / 2));
  for (let i = 0; i < fade; i++) {
    const f = i / fade;
    ch[i] *= f;
    ch[samples - 1 - i] *= f;
  }

  const src = ctx.createBufferSource();
  src.buffer = ab;
  src.connect(outGain);

  const now = ctx.currentTime;
  if (playHead < now) {
    playHead = now + 0.08;
  }
  src.start(playHead);
  playHead += ab.duration;

  sources.push(src);
  updateMute();

  src.onended = () => {
    sources = sources.filter(s => s !== src);
    updateMute();
  };
}

function clearAudio() {
  sources.forEach(s => { try { s.stop(); } catch {} });
  sources = [];
  playHead = 0;
  if (lastSay) lastSay.classList.add('cut');
  duck(false);
  updateMute();
}

function duck(on) {
  if (!outGain || !ctx) return;
  const t = ctx.currentTime;
  outGain.gain.cancelScheduledValues(t);
  outGain.gain.setTargetAtTime(on ? 0.25 : 1.0, t, on ? 0.04 : 0.12);
}

// Media Audio: Jitter Buffer for YouTube/Video playback
function syncMediaGain(force) {
  if (!mediaGain || !ctx) return;
  const isSpeaking = sources.length > 0;
  const target = !pageAudioOn ? 0.0 : (isSpeaking ? 0.18 : 0.95);
  if (!force && Math.abs(currentMediaTarget - target) < 0.02) return;
  currentMediaTarget = target;
  const t = ctx.currentTime;
  mediaGain.gain.cancelScheduledValues(t);
  mediaGain.gain.setTargetAtTime(target, t, 0.08);
}

function playMediaPcm(b64, rate) {
  if (!ctx || !mediaGain || !pageAudioOn || !b64) return;
  try {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const samples = Math.floor(bytes.byteLength / 2);
    if (!samples) return;
    const i16 = new Int16Array(bytes.buffer, 0, samples);
    const ab = ctx.createBuffer(1, samples, rate || 24000);
    const ch = ab.getChannelData(0);
    for (let i = 0; i < samples; i++) ch[i] = i16[i] / 32768;

    const fade = Math.min(16, Math.floor(samples / 2));
    for (let i = 0; i < fade; i++) {
      const f = i / fade;
      ch[i] *= f;
      ch[samples - 1 - i] *= f;
    }

    const src = ctx.createBufferSource();
    src.buffer = ab;
    src.connect(mediaGain);

    const now = ctx.currentTime;
    if (mediaHead < now) {
      mediaHead = now + 0.10;
    } else if (mediaHead - now > 0.45) {
      mediaHead = now + 0.12;
    }
    src.start(mediaHead);
    mediaHead += ab.duration;
  } catch (e) {
    console.warn("playMediaPcm error:", e);
  }
}

// Frame Scheduler
function scheduleScreen(m) {
  pendingScreen = m;
  if (rafScreen) return;
  rafScreen = requestAnimationFrame(() => {
    rafScreen = 0;
    const f = pendingScreen;
    pendingScreen = null;
    if (!f) return;
    $('shot').src = 'data:image/jpeg;base64,' + f.jpeg;
    $('urlInput').value = f.url || '';
  });
}

function updateMute() {
  syncMediaGain(false);
  if (!worklet) return;
  const talking = sources.length > 0;
  worklet.port.postMessage({ muted: talking && !$('barge').checked });
}

// ---- Call Lifecycle ----
async function startCall() {
  $('dial').disabled = true;
  try {
    const c = await (await fetch('/config')).json();
    if (c.stt_rate) sttRate = c.stt_rate;
    if (c.tts_rate) ttsRate = c.tts_rate;
  } catch {}

  ctx = new AudioContext();
  outGain = ctx.createGain();
  outGain.connect(ctx.destination);

  mediaGain = ctx.createGain();
  mediaGain.gain.value = pageAudioOn ? 0.95 : 0.0;
  mediaGain.connect(ctx.destination);

  try { micCtx = new AudioContext({ sampleRate: sttRate }); } catch { micCtx = new AudioContext(); }
  await micCtx.audioWorklet.addModule('/static/pcm-worklet.js');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    const mic = micCtx.createMediaStreamSource(micStream);
    worklet = new AudioWorkletNode(micCtx, 'phone-line-capture', { processorOptions: { target: sttRate } });
    const analyser = micCtx.createAnalyser();
    mic.connect(analyser);
    mic.connect(worklet);
    const data = new Uint8Array(analyser.fftSize);
    (function meter() {
      if (!ctx) return;
      analyser.getByteTimeDomainData(data);
      let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      $('lvl').style.width = Math.min(100, peak * 1.6) + '%';
      requestAnimationFrame(meter);
    })();
  } catch (err) {
    micStream = null; worklet = null;
    log('Microphone unavailable: ' + esc(err.message));
  }

  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/call`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    if (worklet) worklet.port.onmessage = e => { if (ws && ws.readyState === 1) ws.send(e.data); };
    ws.send(JSON.stringify({ type: 'barge_in', enabled: $('barge').checked }));
    $('end').disabled = false;
    $('headerDot').classList.add('active');
    $('statusTxt').textContent = 'Connected';
    t0 = Date.now();
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $('timer').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 500);
    $('last').textContent = 'Connecting...';
  };

  ws.onmessage = e => {
    if (typeof e.data !== 'string') return playPcm(e.data);
    try {
      const m = JSON.parse(e.data);
      switch (m.type) {
        case 'say':
          lastSay = addMsg('guide', 'Assistant', m.text);
          $('last').textContent = m.text;
          if (/login|sign in|लॉगिन|खाता|पासवर्ड/i.test(m.text)) {
            showConsent("Authentication Required", m.text, "Log In", "Cancel");
          }
          break;
        case 'config':
          if (m.stt_rate) sttRate = m.stt_rate;
          if (m.tts_rate) ttsRate = m.tts_rate;
          $('rateLabel').textContent = `${ttsRate / 1000} kHz / ${sttRate / 1000} kHz`;
          break;
        case 'pong':
          break;
        case 'heard': {
          const label = `Caller${m.lang ? ' / ' + m.lang : ''}${m.latency ? ' / ' + m.latency + 'ms' : ''}` +
            (m.ignored ? ` (ignored: ${m.ignored.toLowerCase().replace('_', ' ')})` : '');
          const d = addMsg('caller', label, m.text);
          if (m.ignored) d.classList.add('ignored');
          break;
        }
        case 'duck': duck(m.on); break;
        case 'clear_audio': clearAudio(); log('Barge-in: speech interrupted'); break;
        case 'action':
          if (m.name !== 'say') {
            log(`<span class="action-tag">${esc(m.name)}</span> ${esc(JSON.stringify(m.args))}`);
          }
          break;
        case 'screen':
          scheduleScreen(m);
          break;
        case 'media_audio':
          playMediaPcm(m.pcm, m.rate);
          break;
        case 'sms':
          $('sms').style.display = 'block';
          $('sms').innerHTML = `SMS: <b>${esc(m.text)}</b>`;
          log('SMS received: ' + esc(m.text));
          break;
        case 'status':
          log('Status: ' + esc(m.text));
          $('statusTxt').textContent = m.text;
          break;
        case 'log': log(esc(m.text)); break;
        case 'hangup': endCall(); break;
      }
    } catch (err) {
      console.warn("ws parse error:", err);
    }
  };

  ws.onclose = e => {
    log(`Call ended${e.reason ? ' (' + esc(e.reason) + ')' : ''}`);
    endCall();
  };
  ws.onerror = () => { log('Connection error'); };
}

setInterval(() => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping' }));
}, 15000);

function endCall() {
  if (ws && ws.readyState <= 1) ws.close();
  ws = null;
  clearInterval(timerId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  setTimeout(() => {
    if (ctx) { ctx.close(); ctx = null; }
    if (micCtx) { micCtx.close(); micCtx = null; }
  }, 300);
  worklet = null;
  mediaGain = null;
  mediaHead = 0;
  playHead = 0;
  $('dial').disabled = false;
  $('end').disabled = true;
  $('headerDot').classList.remove('active');
  $('statusTxt').textContent = 'Ready';
  $('last').textContent = 'Call ended.';
  $('digits').textContent = '';
  dialedNumbers = '';
  $('consentCard').style.display = 'none';
}

function showConsent(title, desc, allowText, denyText) {
  $('consentTitle').textContent = title;
  $('consentDesc').textContent = desc;
  $('consentAllowBtn').textContent = allowText || "Log In";
  $('consentDenyBtn').textContent = denyText || "Cancel";
  $('consentCard').style.display = 'block';
}

$('consentAllowBtn').onclick = () => {
  $('consentCard').style.display = 'none';
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'typed', text: 'हाँ, लॉगिन कर दो' }));
  }
};
$('consentDenyBtn').onclick = () => {
  $('consentCard').style.display = 'none';
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'typed', text: 'नहीं, लॉगिन मत करो' }));
  }
};

// Keypad DTMF
document.querySelectorAll('.keys button').forEach(btn => {
  btn.onclick = () => {
    const k = btn.dataset.key;
    if (!k) return;
    playDtmfTone(k);
    dialedNumbers = (dialedNumbers + k).slice(-16);
    $('digits').textContent = dialedNumbers;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'dtmf', key: k }));
    }
  };
});

// Quick Action Buttons
$('quickLoginBtn').onclick = () => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'typed', text: 'कृपया इस वेबसाइट पर साइन इन या लॉगिन कर दो' }));
  }
};

$('quickSkipAdBtn').onclick = () => {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'skip_ad' }));
    log('Action: Skip Ad');
  }
};

// Navigation
$('navBack').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'nav_back' })); };
$('navFwd').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'nav_forward' })); };
$('navReload').onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'nav_reload' })); };

$('urlGo').onclick = () => {
  const val = $('urlInput').value.trim();
  if (val && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'open_url_direct', url: val }));
  }
};
$('urlInput').onkeydown = e => { if (e.key === 'Enter') $('urlGo').click(); };

// Audio Mute Toggle
$('pageAudioBtn').onclick = () => {
  pageAudioOn = !pageAudioOn;
  $('pageAudioBtn').classList.toggle('muted', !pageAudioOn);
  $('pageAudioBtn').classList.toggle('active', pageAudioOn);
  $('pageAudioBtn').textContent = pageAudioOn ? 'Audio' : 'Muted';
  syncMediaGain(true);
};

// Fullscreen Toggle
$('fullscreenBtn').onclick = () => {
  const isFull = $('stage').classList.toggle('fullscreen');
  $('fullscreenBtn').textContent = isFull ? 'Restore' : 'Fullscreen';
};

// Direct Screen Click & Wheel
$('shot').addEventListener('click', e => {
  if (!ws || ws.readyState !== 1) return;
  const img = $('shot');
  const rect = img.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  const ripple = document.createElement('div');
  ripple.className = 'click-ripple';
  ripple.style.left = `${e.clientX - rect.left}px`;
  ripple.style.top = `${e.clientY - rect.top}px`;
  $('viewportWrap').appendChild(ripple);
  setTimeout(() => ripple.remove(), 350);

  const natRatio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : (16 / 10);
  const boxRatio = rect.width / rect.height;
  let drawW = rect.width, drawH = rect.height, offX = 0, offY = 0;
  if (boxRatio > natRatio) {
    drawW = rect.height * natRatio;
    offX = (rect.width - drawW) / 2;
  } else if (boxRatio < natRatio) {
    drawH = rect.width / natRatio;
    offY = (rect.height - drawH) / 2;
  }
  const nx = (e.clientX - rect.left - offX) / drawW;
  const ny = (e.clientY - rect.top - offY) / drawH;
  if (nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1) {
    ws.send(JSON.stringify({ type: 'ui_click', x: nx, y: ny }));
  }
});

$('shot').addEventListener('wheel', e => {
  if (!ws || ws.readyState !== 1) return;
  e.preventDefault();
  ws.send(JSON.stringify({ type: 'ui_wheel', dy: e.deltaY }));
}, { passive: false });

// Form Controls
$('dial').onclick = () => startCall().catch(err => { log('Error: ' + esc(err.message)); $('dial').disabled = false; });
$('end').onclick = endCall;
$('barge').onchange = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'barge_in', enabled: $('barge').checked }));
  updateMute();
};
$('typed').onkeydown = e => {
  if (e.key === 'Enter' && ws && ws.readyState === 1 && e.target.value.trim()) {
    ws.send(JSON.stringify({ type: 'typed', text: e.target.value.trim() }));
    e.target.value = '';
  }
};
$('clearLogBtn').onclick = () => { $('logList').innerHTML = ''; };
</script>
